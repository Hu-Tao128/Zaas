server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # Cabeceras comunes para todas las peticiones al backend.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # API JSON de Flask.
    location /api/ {
        proxy_pass http://backend:5000;
    }

    # Autenticación (Firebase -> sesión Flask).
    location /auth/ {
        proxy_pass http://backend:5000;
    }

    # API de contratos, incluida la descarga de PDF.
    location /contratos/api/ {
        proxy_pass http://backend:5000;
    }

    # API de pagos y disputas.
    location /pagos/api/ {
        proxy_pass http://backend:5000;
    }

    # Resto de rutas: SPA de React (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash se pueden cachear de forma agresiva.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
