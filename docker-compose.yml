# Docker Compose para levantar Zaas (backend Flask + frontend React/nginx).
#
# Uso rápido:
#   1. Copia .env.example a .env y ajusta los valores.
#   2. Copia frontend/.env.example a frontend/.env con la configuración de Firebase.
#   3. Coloca la llave de Firebase Admin en backend/keys/key.json.
#   4. docker compose up --build
#
# La aplicación queda disponible en http://localhost:8080
name: zaas

services:
  backend:
    build:
      context: ./backend
    image: zaas-backend:latest
    restart: unless-stopped
    environment:
      # SQLite dentro de un volumen persistente. Para PostgreSQL cambia esta
      # variable, por ejemplo: postgresql+psycopg2://usuario:clave@db:5432/zaas
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/instance/zaas.db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-cambiar-en-produccion}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      FIREBASE_KEY_PATH: ${FIREBASE_KEY_PATH:-keys/key.json}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      # Base de datos SQLite persistente. Si prefieres usar el archivo local,
      # comenta este volumen y descomenta el bind mount de abajo.
      - zaas_db:/app/instance
      # - ./backend/instance:/app/instance
      # Llave de servicio de Firebase Admin (solo lectura).
      - ./backend/keys:/app/keys:ro
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s = socket.create_connection(('127.0.0.1', 5000), 3); s.close()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
    image: zaas-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  zaas_db:
