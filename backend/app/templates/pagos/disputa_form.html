{% extends "base.html" %}
{% block title %}Nueva Disputa - Zaas{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;margin:2rem auto;">
    <h2 class="mb-2">Abrir Disputa — Contrato #{{ contrato.id }}</h2>
    <form method="POST">
        {{ form.hidden_tag() }}
        <div class="form-group">
            {{ form.tipo.label }} {{ form.tipo() }}
        </div>
        <div class="form-group">
            {{ form.descripcion.label }} {{ form.descripcion() }}
        </div>
        <button type="submit" class="btn btn-danger">Enviar Disputa</button>
        <a href="{{ url_for('contratos.ver_contrato', id=contrato.id) }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
